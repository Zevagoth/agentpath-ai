[project]
name = "agentpath-ingestion"
version = "0.1.0"
description = "AgentPath AI - synthetic procedure rendering and RAGFlow ingestion CLI"
requires-python = ">=3.12"
dependencies = [
    "agentpath",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.scripts]
agentpath-ingest = "agentpath_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpath_ingestion"]

[tool.uv.sources]
agentpath = { workspace = true }
