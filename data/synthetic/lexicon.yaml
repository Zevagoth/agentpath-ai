# FICTIONAL — SYNTHETIC DEMO DATA
#
# Customer-service lexicon for AgentPath AI query understanding.
#
# This file is the deterministic half of query understanding. It runs before
# retrieval and is intentionally auditable: when a query is expanded or tagged,
# the reason is a line in this file rather than a model's guess.
#
# Sections:
#   typos          - misspelling -> correction, applied to English tokens
#   abbreviations  - agent shorthand -> full form
#   concepts       - canonical concept with its Arabic and English surface forms,
#                    the product lines it implies, and the scenario tags it sets
#   product_lines  - additional standalone hints per product line
#
# Arabic entries are written naturally; the pipeline normalizes both the query
# and these entries (diacritics, alef/ya/ta-marbuta) before comparing them.

