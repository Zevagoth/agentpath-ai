[project]
name = "agentpath-workspace"
version = "0.1.0"
description = "AgentPath AI - workspace root (not a distributable package)"
requires-python = ">=3.12"
dependencies = [
    "agentpath",
    "agentpath-ingestion",
    "agentpath-eval",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "services/ingestion", "evaluation"]

[tool.uv.sources]
agentpath = { workspace = true }
agentpath-ingestion = { workspace = true }
agentpath-eval = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    # Needed only by scripts/configure_ragflow_models.py: RAGFlow's auth endpoints
    # expect RSA-encrypted passwords, produced with the same library RAGFlow uses.
    "pycryptodomex>=3.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the live RAGFlow / Ollama / reranker stack",
]
filterwarnings = ["error::DeprecationWarning:agentpath.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".external", "data/synthetic/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
