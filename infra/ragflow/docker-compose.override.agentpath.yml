# AgentPath AI additions to the RAGFlow stack.
#
# Applied as a Compose override on top of RAGFlow's own docker-compose.yml, so
# RAGFlow itself stays untouched at its pinned tag and our additions are
# reviewable in one place.
#
# What this adds:
#   * agentpath-reranker - cross-encoder reranking service on the RAGFlow
#     network. RAGFlow talks to it through its "HuggingFace" rerank provider,
#     whose wire protocol is exactly Text Embeddings Inference's /rerank
#     endpoint: {"query", "texts"} in, [{"index", "score"}] out.
#
# Why TEI rather than a heavier runtime: the image is small, the tag is pinned,
# it runs the model on CPU so the RTX 4060 stays free for the Stage 2 chat
# model, and RAGFlow already supports the protocol without a custom adapter.

services:
  # Embedding service. RAGFlow's slim image ships no embedding model, so one has
  # to be provided externally.
  #
  # Why a container rather than the host's Ollama daemon: ufw is active on the
  # development host and drops traffic from Docker's user-defined bridge to host
  # addresses. Reaching a host-side daemon would need a firewall rule; keeping the
  # model service on RAGFlow's own network needs nothing, exposes nothing, and
  # leaves the host Ollama untouched on loopback for later answer generation.
  #
  # Same model as planned (bge-m3, strong Arabic and English), same TEI image as
  # the reranker, so no additional image download.
  agentpath-embedder:
    image: ${AGENTPATH_EMBEDDER_IMAGE}
    container_name: agentpath-embedder
    command:
      - --model-id
      - ${AGENTPATH_EMBEDDER_MODEL}
      - --port
      - "80"
      # bge-m3 is an XLM-R large model and the ONNX runtime sizes its arena from
      # max-batch-tokens. Left at TEI's defaults the container settled at 7.5 GB
      # resident; at 8192 tokens it could not finish warm-up inside a 4 GB cap and
      # restart-looped 93 times. 2048 tokens is still four of our ~512-token
      # chunks per batch, which is ample: a query embeds one short string, and
      # ingestion is a one-off pass over 33 chunks.
      # Lowered from 2048 when the client batch had to rise to 16. TEI sizes its
      # buffers from (client batch x batch tokens), so raising one means lowering
      # the other to stay inside the ceiling: at 2048 x 16 the container sat at
      # 4.6 GiB of real anonymous memory against a 5 GiB cap, which is no margin to
      # run an ingestion in. Our chunks are ~512 tokens, so 1024 still packs two per
      # compute batch; it costs throughput on a one-off pass, not correctness.
      - --max-batch-tokens
      - "1024"
      # How many strings a caller may put in ONE request. Raised from 8 after
      # ingesting an external corpus failed on it: RAGFlow embeds in batches of 16
      # and TEI answered `413 batch size 16 > maximum allowed batch size 8`, which
      # aborted parsing partway through the 40 MRAMG documents. The synthetic corpus
      # never hit it because its 33 chunks arrived in smaller batches.
      #
      # Set to exactly what RAGFlow sends. 32 was tried first, for headroom, and
      # the container settled at 4.6 GiB of its 5 GiB ceiling - too close to the
      # limit to run a 40-document ingestion through. Peak compute memory is
      # governed by --max-batch-tokens, but TEI also sizes buffers from the client
      # batch it must be able to accept, so this value is not free.
      - --max-client-batch-size
      - "16"
      - --auto-truncate
    environment:
      - HUGGINGFACE_HUB_CACHE=/data
      - HF_HOME=/data
      # Each ONNX Runtime worker keeps its own memory arena, so the thread count
      # is a memory knob as much as a speed one. 8 of 20 threads is plenty here.
      - OMP_NUM_THREADS=8
      - RAYON_NUM_THREADS=8
    volumes:
      - agentpath_embedder_cache:/data
    # Hard ceiling. Measured at 7.5 GB resident without one, which is too much to
    # take from a developer machine that is also running an IDE and a browser.
    # The ONNX runtime sizes its arena from max-batch-tokens and from the largest
    # client batch it must accept, so this ceiling and the two batch settings above
    # are one decision, not three. The container is killed rather than allowed to
    # grow past it, which is the honest failure mode.
    mem_limit: 5g
    ports:
      # Loopback only, for verification from the host.
      - ${AGENTPATH_EMBEDDER_PORT}:80
    networks:
      - ragflow
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    restart: unless-stopped

  # Reranking service. This one runs on the GPU, and the reason is measured
  # rather than assumed: bge-reranker-v2-m3 is an XLM-R large cross-encoder, and
  # scoring ~30 candidates for a single query took 20-22 s on the CPU backend
  # (which caps its batch at 4), against 0.17-0.36 s for the whole hybrid
  # retrieval call without reranking. CPU reranking therefore cannot meet the
  # two-second target; the GPU can.
  #
  # The image tag encodes the CUDA compute capability: 89 is Ada Lovelace, which
  # is what an RTX 4060 is. Change it for other hardware (turing, 86, hopper).
  agentpath-reranker:
    image: ${AGENTPATH_RERANKER_IMAGE}
    container_name: agentpath-reranker
    command:
      - --model-id
      - ${AGENTPATH_RERANKER_MODEL}
      - --port
      - "80"
      # 32 candidates per query is the retrieval budget; 64 leaves headroom.
      - --max-client-batch-size
      - "64"
      - --max-batch-tokens
      - "16384"
    environment:
      # Model weights land in the named volume below, not in the image layer.
      - HUGGINGFACE_HUB_CACHE=/data
      - HF_HOME=/data
    volumes:
      - agentpath_reranker_cache:/data
    # The model lives in VRAM here, so host RAM is only weights staging and the
    # HTTP layer.
    mem_limit: 3g
    ports:
      # Loopback only. Published so the verification script and tests can reach
      # it directly from the host without entering the container.
      - ${AGENTPATH_RERANKER_PORT}:80
    networks:
      - ragflow
    # GPU reservation kept here but inert: this host hits an unresolved CUDA
    # initialization failure inside Docker (CUDA_ERROR_UNKNOWN) even though
    # nvidia-smi works in the same container and devices plus driver libraries are
    # injected, so TEI falls back to CPU. Both 89-1.8 and 89-latest behave the
    # same way, which rules out the image but does not identify the cause.
    # Re-enable by uncommenting once container CUDA initialises here
    # (see docs/TROUBLESHOOTING.md).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

volumes:
  agentpath_embedder_cache:
    driver: local
  agentpath_reranker_cache:
    driver: local
